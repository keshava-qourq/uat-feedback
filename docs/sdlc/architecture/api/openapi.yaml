components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        role:
          type: string
        patient_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        must_set_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - is_active
      - must_set_password
      - created_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - created_at
      - last_seen_at
      - idle_expires_at
    invites:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token_hash:
          type: string
        patient_id:
          type: string
          format: uuid
        issued_by_user_id:
          type: string
          format: uuid
        granted_role:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
        opened_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time
        intake_completed_at:
          type: string
          format: date-time
      required:
      - id
      - token_hash
      - patient_id
      - issued_by_user_id
      - granted_role
      - status
      - expires_at
    share_links:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token_hash:
          type: string
        patient_id:
          type: string
          format: uuid
        created_by_user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - token_hash
      - patient_id
      - created_by_user_id
      - expires_at
    audit_log:
      type: object
      properties:
        id:
          type: string
        actor_user_id:
          type: string
          format: uuid
        action:
          type: string
        patient_id:
          type: string
          format: uuid
        detail:
          type: string
        occurred_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - occurred_at
    patients:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dataset_patient_id:
          type: string
        dataset_version:
          type: string
        display_name:
          type: string
        birth_year:
