# The axSpA condition pack: every clinical constant, as data.
#
# Nothing in this file is interpreted by name anywhere in the application --
# the loader reads sections, keys and values generically -- so changing a code
# list, a threshold or a sentence here needs no code deployment (NFR-019).
pack_key: axspa
version: 1
display_name: Axial spondyloarthritis

code_lists:
  back_pain:
    system: ICD-10
    codes: ["M54.5", "M54.50", "M54.9", "M545"]
  sacroiliitis_imaging:
    system: ICD-10
    codes: ["M46.1", "M45.9"]
  uveitis:
    system: ICD-10
    codes: ["H20.0", "H20.00"]
  psoriasis:
    system: ICD-10
    codes: ["L40.0", "L40.9"]
  inflammatory_bowel_disease:
    system: ICD-10
    codes: ["K50.90", "K51.90"]
  enthesitis:
    system: ICD-10
    codes: ["M77.9", "M76.60"]
  hla_b27_test:
    system: LOINC
    codes: ["17695-9"]
  crp_test:
    system: LOINC
    codes: ["1988-5"]
  esr_test:
    system: LOINC
    codes: ["4537-7"]
  nsaid_therapy:
    system: ATC
    codes: ["M01AE01", "M01AB05", "M01AH01"]
  mri_si_joints:
    system: CPT
    codes: ["72195", "72196"]
  xray_si_joints:
    system: CPT
    codes: ["72170", "72200"]
  mechanical_back_pain:
    system: ICD-10
    codes: ["M54.4", "M51.26", "S33.5XXA"]
  fibromyalgia:
    system: ICD-10
    codes: ["M79.7"]

signals:
  chronic_back_pain:
    label: Chronic back pain for three months or more
    code_lists: [back_pain]
    min_occurrences: 2
  onset_before_45:
    label: Back pain beginning before age 45
    intake_keys: [age_at_onset]
  inflammatory_back_pain:
    label: Inflammatory pattern back pain
    intake_keys: [night_pain, morning_stiffness, better_with_movement]
  hla_b27_positive:
    label: HLA-B27 positive
    code_lists: [hla_b27_test]
    positive_values: ["positive", "detected"]
  sacroiliitis_on_imaging:
    label: Sacroiliitis on imaging
    code_lists: [sacroiliitis_imaging, mri_si_joints, xray_si_joints]
  uveitis_history:
    label: History of uveitis
    code_lists: [uveitis]
  psoriasis_history:
    label: History of psoriasis
    code_lists: [psoriasis]
  ibd_history:
    label: History of inflammatory bowel disease
    code_lists: [inflammatory_bowel_disease]
  enthesitis_history:
    label: Heel or other enthesitis
    code_lists: [enthesitis]
  nsaid_response:
    label: Good response to NSAIDs
    code_lists: [nsaid_therapy]
    intake_keys: [nsaid_relief]
  raised_inflammatory_markers:
    label: Raised CRP or ESR
    code_lists: [crp_test, esr_test]

criteria:
  asas_imaging_arm:
    label: ASAS classification, imaging arm
    kind: set
    entry: [chronic_back_pain, onset_before_45]
    required: [sacroiliitis_on_imaging]
    any_of:
      min: 1
      signals:
        - inflammatory_back_pain
        - hla_b27_positive
        - uveitis_history
        - psoriasis_history
        - ibd_history
        - enthesitis_history
        - nsaid_response
        - raised_inflammatory_markers
  asas_clinical_arm:
    label: ASAS classification, clinical arm
    kind: set
    entry: [chronic_back_pain, onset_before_45]
    required: [hla_b27_positive]
    any_of:
      min: 2
      signals:
        - inflammatory_back_pain
        - uveitis_history
        - psoriasis_history
        - ibd_history
        - enthesitis_history
        - nsaid_response
        - raised_inflammatory_markers
  spartan_referral:
    label: SPARTAN referral points
    kind: points
    items:
      inflammatory_back_pain: 2
      hla_b27_positive: 3
      sacroiliitis_on_imaging: 3
      uveitis_history: 2
      psoriasis_history: 1
      ibd_history: 2
      enthesitis_history: 1
      nsaid_response: 1
      raised_inflammatory_markers: 1
    pass_score: 4

# Counter-evidence rules. Each rule names, as data: the plain-language
# sentence a clinician reads, the effect it has on the tier and the tier that
# effect names, whether it still awaits clinical sign-off, what triggers it
# (coded events, intake answers, or clues the free-text extractor found in a
# note), and -- where there is one -- the alternative explanation to name.
counter_evidence:
  established_mechanical_cause:
    label: Documented mechanical or structural cause for the back pain
    plain_language: A mechanical or structural cause for the back pain is already recorded, which explains the picture without an inflammatory cause.
    code_lists: [mechanical_back_pain]
    effect: demote
    demote_to: Low
    requires_sign_off: false
  widespread_pain_syndrome:
    label: Widespread pain syndrome better explains the picture
    plain_language: A widespread pain syndrome is recorded, which better explains pain spread across the body.
    code_lists: [fibromyalgia]
    effect: demote
    demote_to: Moderate
    requires_sign_off: false
  specialist_excluded:
    label: A rheumatologist has already excluded the condition
    plain_language: A specialist has already looked at this picture and excluded the condition.
    intake_keys: [rheumatology_excluded]
    effect: demote
    demote_to: Low
    requires_sign_off: false
  iliac_side_only_sclerosis_pattern:
    label: Sclerosis confined to the iliac side of the joint
    plain_language: The imaging report describes sclerosis on the iliac side of the joint only, which is not the pattern this assessment looks for.
    clues:
      - clue: iliac_side_only_sclerosis
    effect: cap
    cap_to: Moderate
    requires_sign_off: true
    alternative_explanation: A pattern consistent with osteitis condensans ilii.
  erosions_absent_pattern:
    label: No erosions reported on imaging
    plain_language: The imaging report states that no erosions are present, which weighs against an inflammatory cause.
    clues:
      - clue: erosions
        value: absent
    effect: cap
    cap_to: Moderate
    requires_sign_off: true
  postpartum_onset_timing:
    label: Symptom onset close to a delivery or the postpartum period
    plain_language: The symptoms are described as beginning around a delivery, inside the postpartum window this pack declares.
    clues:
      - clue: postpartum_timing
    window_months: postpartum_window_months
    effect: cap
    cap_to: Moderate
    requires_sign_off: true
    alternative_explanation: A pattern consistent with osteitis condensans ilii.
  widespread_pain_reported:
    label: Widespread pain reported across the body
    plain_language: The notes describe pain spread widely across the body rather than confined to the back and sacroiliac joints.
    clues:
      - clue: widespread_pain_wording
    effect: cap
    cap_to: Moderate
    requires_sign_off: false
  normal_crp_result:
    label: A normal CRP result
    plain_language: The recorded CRP result is normal, so there is no laboratory sign of inflammation.
    clues:
      - clue: normal_inflammatory_marker_wording
    effect: cap
    cap_to: Moderate
    requires_sign_off: false
  poor_nsaid_response:
    label: Poor response to NSAIDs
    plain_language: A full trial of NSAIDs gave little or no relief, which weighs against an inflammatory cause.
    clues:
      - clue: poor_anti_inflammatory_response_wording
    effect: cap
    cap_to: Moderate
    requires_sign_off: false
  load_related_oedema_pattern:
    label: Load-related pattern of sacroiliac bone-marrow oedema
    plain_language: The oedema is described in a load-related distribution, the pattern seen with repeated mechanical loading.
    clues:
      - clue: load_related_oedema_wording
    effect: cap
    cap_to: Moderate
    requires_sign_off: true
    alternative_explanation: A load-related mechanical pattern seen in athletes.
  activity_worsened_pain_pattern:
    label: Pain worse with activity and loading
    plain_language: The pain is recorded as worse with activity and loading and easier with rest, which is a mechanical rather than an inflammatory pattern.
    clues:
      - clue: activity_worsened_pain_wording
    effect: cap
    cap_to: Moderate
    requires_sign_off: true

# How a counter-evidence rule changes the tier, declared as data rather than
# as a branch in code: each rule above names its effect and the tier that
# effect reads, and these entries say what each effect means.
demotion_rules:
  demote:
    label: Lower the tier to the rule's demote_to value when the rule matches.
    applies_to: counter_evidence
    tier_from: demote_to
    never_raises: true
  cap:
    label: Cap the tier at the rule's cap_to value when the rule matches; never raise it.
    applies_to: counter_evidence
    tier_from: cap_to
    never_raises: true

thresholds:
  high: 0.6
  moderate: 0.3
  reachable_history_months: 24
  # How close to a delivery an onset has to be for the timing rule to fire.
  postpartum_window_months: 12
  min_events_for_scoring: 3

workup_items:
  hla_b27_test:
    label: HLA-B27 blood test
    reasoning: A positive result moves this case into the clinical classification arm; a negative result weighs against it.
    code_lists: [hla_b27_test]
  mri_si_joints:
    label: MRI of the sacroiliac joints
    reasoning: Imaging is the only way to show active sacroiliitis when plain films are normal.
    code_lists: [mri_si_joints]
  inflammatory_markers:
    label: CRP and ESR
    reasoning: Raised markers support an inflammatory cause and give a baseline before treatment.
    code_lists: [crp_test, esr_test]
  rheumatology_referral:
    label: Referral to rheumatology
    reasoning: A specialist confirms or excludes the diagnosis and can start treatment without further delay.
    code_lists: []

copy:
  tier_high_headline: Your history has several patterns worth checking with a specialist.
  tier_moderate_headline: Your history has a few patterns worth mentioning at your next visit.
  tier_low_headline: Your history does not show the patterns we look for.
  insufficient_history_headline: We do not have enough of your history to say anything useful yet.
  insufficient_history_detail: Records before your earliest available visit are not reachable, so some of the picture is missing.
  next_step_prompt: Bring this summary to your next appointment and ask about the suggested tests.
  disclaimer: This is not a diagnosis. Only a clinician can tell you what your symptoms mean.
  extraction_caveat: The notes in this dataset are generated from templates, which makes clue extraction easier here than it would be on real clinical text.

# The clues the free-text extractor looks for in clinic notes and imaging
# reports. Data, not code: the extractor reads this section generically and
# names no clue of its own (NFR-019). `values` (when present) is the closed
# set of finding_value the extractor may return for that clue.
#
# `match_any` is the wording the deterministic fallback matches when no
# language model is configured: a list of groups, each group a list of terms
# that must all appear in one sentence of the note. `value_terms` names, per
# allowed finding_value, the wording that decides it (first match wins).
free_text_clues:
  sacroiliitis_wording:
    label: Wording describing sacroiliitis or sacroiliac joint inflammation
    description: A sentence stating that the sacroiliac joints are inflamed, or describing sacroiliitis in any wording.
    match_any:
      - [sacroiliitis]
      - [sacroiliac, inflam]
  iliac_side_only_sclerosis:
    label: Sclerosis confined to the iliac side of the joint
    description: A sentence stating that sclerosis is present on the iliac side only.
    match_any:
      - [sclerosis, iliac]
  erosions:
    label: Presence or absence of erosions
    description: A sentence stating that erosions are present, or stating that there are none.
    values: [present, absent]
    match_any:
      - [erosion]
    value_terms:
      absent:
        - [no erosion]
        - [without erosion]
        - [erosions are not]
      present:
        - [erosion]
  widespread_pain_wording:
    label: Pain described as widespread across the body
    description: A sentence describing pain spread widely across the body rather than confined to the back.
    match_any:
      - [widespread pain]
      - [pain, all four quadrants]
  normal_inflammatory_marker_wording:
    label: An inflammatory marker described as normal
    description: A sentence stating that CRP or another inflammatory marker is normal.
    match_any:
      - [crp, normal]
      - [inflammatory markers, normal]
  poor_anti_inflammatory_response_wording:
    label: Little or no relief from anti-inflammatory treatment
    description: A sentence stating that anti-inflammatory medication gave little or no relief.
    match_any:
      - [anti-inflammatories, no meaningful relief]
      - [anti-inflammatory, no relief]
      - [nsaid, no relief]
  load_related_oedema_wording:
    label: Bone-marrow oedema in a load-related distribution
    description: A sentence describing sacroiliac bone-marrow oedema in a load-related or mechanical distribution.
    match_any:
      - [oedema, load-related]
      - [edema, load-related]
      - [load-related mechanical pattern]
  activity_worsened_pain_wording:
    label: Pain worse with activity and loading
    description: A sentence stating that the pain is worse with activity or loading and eases with rest.
    match_any:
      - [worse with activity]
      - [worse with loading]
  postpartum_timing:
    label: Symptoms described in relation to a recent pregnancy or delivery
    description: A sentence placing the symptoms after a delivery or in the postpartum period.
    match_any:
      - [postpartum]
      - [post-partum]
      - [after her delivery]
      - [after delivery]

prohibited_terms:
  - axial spondyloarthritis
  - axSpA
  - High
  - Moderate
  - score
